version: '3.9'

services:

  # ── API .NET 8 ──────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: src/SmartRecovery.API/Dockerfile
    container_name: smart-recovery-api
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - smart-recovery-net

  # ── PostgreSQL 16 ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: smart-recovery-db
    environment:
      POSTGRES_DB: smart_recovery
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Aguarda o PostgreSQL estar pronto antes de subir a API
      test: ["CMD-SHELL", "pg_isready -U admin -d smart_recovery"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - smart-recovery-net

volumes:
  pgdata:

networks:
  smart-recovery-net:
    driver: bridge
